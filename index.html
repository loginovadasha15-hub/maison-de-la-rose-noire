<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maison de la Rose Noire</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>
<div class="particles"></div>

<main>

    <div class="logo">

        <div class="line"></div>

        <div class="fleur">
            ⚜
        </div>

        <div class="line"></div>

    </div>

    <h1>
        Maison de la Rose Noire
    </h1>

    <h2>
        Конверт семьи
    </h2>

    <p class="quote">

        «В мафии ценится не тот,
        кто говорит громче всех,
        а тот, кому доверяют молча.»

    </p>

    <div class="envelope" id="envelope">

        <div class="seal"></div>

        <div class="top"></div>

        <div class="letter">

            <h3>
                Секретное письмо
            </h3>

            <p>

                Внутри находится ваше персональное поручение.

                Открывайте только тогда,
                когда будете готовы начать игру.

            </p>

            <button id="accept">

                Миссия принята

            </button>

        </div>

    </div>

    <button id="openButton">

        Вскрыть конверт

    </button>

</main>

<script src="script.js"></script>

</body>
</html>
